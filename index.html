```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FACTION THING A LING</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #bdbdbd;
    color: #111;
    font-family: "Courier New", monospace;
}

/* HEADER */

header {
    background: #222;
    color: white;
    border-bottom: 8px solid #000;
    padding: 25px;
}

header h1 {
    margin: 0;
    font-size: 32px;
    letter-spacing: 3px;
}

header p {
    margin: 8px 0 0;
    font-size: 14px;
}

/* MAIN */

.container {
    width: 95%;
    max-width: 1200px;
    margin: 25px auto;
}

/* BRICK SECTIONS */

.section {
    background: #e5e5e5;
    border: 6px solid #000;
    padding: 20px;
    margin-bottom: 25px;
}

.section-title {
    background: #000;
    color: white;
    padding: 12px;
    font-size: 20px;
    font-weight: bold;
    margin: -20px -20px 20px -20px;
}

/* INPUTS */

input {
    width: 100%;
    height: 45px;

    background: white;
    color: black;

    border: 4px solid #000;

    padding: 8px;

    font-family: "Courier New", monospace;
    font-size: 16px;

    border-radius: 0;
}

input:focus {
    outline: 4px solid #555;
}

/* BUTTONS */

button {
    border: 4px solid #000;
    border-radius: 0;

    background: #ccc;
    color: #000;

    padding: 9px 14px;

    font-family: "Courier New", monospace;
    font-weight: bold;

    cursor: pointer;
}

button:hover {
    background: #999;
}

button:active {
    transform: translate(3px, 3px);
}

/* ADD BUTTON */

.add-button {
    width: 100%;
    margin-top: 8px;

    background: #333;
    color: white;

    height: 50px;
}

.add-button:hover {
    background: #555;
}

/* LAYOUT */

.main-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 25px;
}

/* FACTION */

.faction {
    background: #fff;

    border: 5px solid #000;

    margin-bottom: 12px;

    padding: 12px;

    display: grid;

    grid-template-columns: 1fr auto;

    gap: 10px;

    align-items: center;
}

.faction-name {
    font-size: 19px;
    font-weight: bold;

    text-transform: uppercase;
}

.faction-points {
    font-size: 15px;

    margin-top: 5px;

    font-weight: bold;
}

/* CONTROLS */

.controls {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    justify-content: flex-end;
}

.controls button {
    min-width: 50px;
}

/* COLORS */

.plus {
    background: #55aa55;
}

.minus {
    background: #cc5555;
}

.rename {
    background: #aaaaaa;
}

.delete {
    background: #666;
    color: white;
}

/* CHART */

.chart-box {
    height: 500px;

    background: white;

    border: 5px solid black;

    padding: 15px;
}

/* TOTAL */

.total {
    margin-top: 15px;

    background: #000;
    color: white;

    border: 4px solid black;

    padding: 12px;

    font-size: 18px;

    font-weight: bold;
}

/* EMPTY */

.empty {
    border: 5px dashed #000;

    padding: 30px;

    text-align: center;

    background: #ccc;

    font-weight: bold;
}

/* MOBILE */

@media (max-width: 850px) {

    .main-grid {
        grid-template-columns: 1fr;
    }

    .faction {
        grid-template-columns: 1fr;
    }

    .controls {
        justify-content: flex-start;
    }

}

</style>
</head>

<body>

<header>

    <h1>FACTION TRACKER</h1>

    <p>
        POINT MANAGEMENT SYSTEM // NO POINT LIMIT
    </p>

</header>

<div class="container">

<div class="main-grid">

<!-- FACTIONS -->

<div class="section">

    <div class="section-title">
        FACTION DATABASE
    </div>

    <input
        id="factionName"
        type="text"
        placeholder="FACTION NAME"
    >

    <br><br>

    <input
        id="startingPoints"
        type="number"
        min="0"
        placeholder="STARTING POINTS"
    >

    <button
        class="add-button"
        onclick="addFaction()"
    >
        [ + ADD FACTION ]
    </button>

    <br><br>

    <div id="factionList"></div>

</div>


<!-- PIE CHART -->

<div class="section">

    <div class="section-title">
        FACTION DISTRIBUTION
    </div>

    <div class="chart-box">

        <canvas id="factionChart"></canvas>

    </div>

    <div class="total">

        TOTAL POINTS:
        <span id="totalPoints">0</span>

    </div>

</div>

</div>

</div>


<script>

/* =========================================
   DATA
========================================= */

let factions =
    JSON.parse(localStorage.getItem("factions")) || [];

let chart;


/* =========================================
   SAVE
========================================= */

function saveFactions() {

    localStorage.setItem(
        "factions",
        JSON.stringify(factions)
    );

}


/* =========================================
   ADD FACTION
========================================= */

function addFaction() {

    const nameInput =
        document.getElementById("factionName");

    const pointsInput =
        document.getElementById("startingPoints");

    const name =
        nameInput.value.trim();

    if (name === "") {

        alert("ERROR: FACTION NAME REQUIRED.");

        return;

    }

    let points =
        Number(pointsInput.value);

    if (
        isNaN(points) ||
        points < 0
    ) {

        points = 0;

    }


    /* Prevent duplicate factions */

    if (
        factions.some(
            faction =>
                faction.name.toLowerCase()
                === name.toLowerCase()
        )
    ) {

        alert(
            "ERROR: FACTION ALREADY EXISTS."
        );

        return;

    }


    factions.push({

        id: Date.now(),

        name: name,

        points: points

    });


    saveFactions();

    nameInput.value = "";

    pointsInput.value = "";

    render();

}


/* =========================================
   CHANGE POINTS
========================================= */

function changePoints(id, amount) {

    const faction =
        factions.find(
            faction =>
                faction.id === id
        );

    if (!faction) return;


    faction.points += amount;


    if (faction.points < 0) {

        faction.points = 0;

    }


    saveFactions();

    render();

}


/* =========================================
   RENAME
========================================= */

function renameFaction(id) {

    const faction =
        factions.find(
            faction =>
                faction.id === id
        );

    if (!faction) return;


    const newName =
        prompt(
            "ENTER NEW FACTION NAME:",
            faction.name
        );


    if (newName === null) return;


    const name =
        newName.trim();


    if (name === "") {

        alert(
            "ERROR: INVALID NAME."
        );

        return;

    }


    if (
        factions.some(
            f =>
                f.id !== id &&
                f.name.toLowerCase()
                === name.toLowerCase()
        )
    ) {

        alert(
            "ERROR: FACTION ALREADY EXISTS."
        );

        return;

    }


    faction.name = name;


    saveFactions();

    render();

}


/* =========================================
   DELETE
========================================= */

function deleteFaction(id) {

    const faction =
        factions.find(
            faction =>
                faction.id === id
        );

    if (!faction) return;


    if (
        !confirm(
            "DELETE FACTION: "
            + faction.name
            + " ?"
        )
    ) {

        return;

    }


    factions =
        factions.filter(
            faction =>
                faction.id !== id
        );


    saveFactions();

    render();

}


/* =========================================
   RENDER FACTIONS
========================================= */

function renderFactions() {

    const list =
        document.getElementById(
            "factionList"
        );


    list.innerHTML = "";


    if (factions.length === 0) {

        list.innerHTML = `
            <div class="empty">
                NO FACTIONS REGISTERED.
            </div>
        `;

        return;

    }


    factions.forEach(
        faction => {

            const element =
                document.createElement(
                    "div"
                );


            element.className =
                "faction";


            element.innerHTML = `

                <div>

                    <div class="faction-name">
                        ${escapeHTML(
                            faction.name
                        )}
                    </div>

                    <div class="faction-points">
                        POINTS:
                        ${faction.points.toLocaleString()}
                    </div>

                </div>


                <div class="controls">

                    <button
                        class="minus"
                        onclick="changePoints(
                            ${faction.id},
                            -100
                        )"
                    >
                        -100
                    </button>

                    <button
                        class="minus"
                        onclick="changePoints(
                            ${faction.id},
                            -10
                        )"
                    >
                        -10
                    </button>

                    <button
                        class="minus"
                        onclick="changePoints(
                            ${faction.id},
                            -1
                        )"
                    >
                        -1
                    </button>


                    <button
                        class="plus"
                        onclick="changePoints(
                            ${faction.id},
                            1
                        )"
                    >
                        +1
                    </button>

                    <button
                        class="plus"
                        onclick="changePoints(
                            ${faction.id},
                            10
                        )"
                    >
                        +10
                    </button>

                    <button
                        class="plus"
                        onclick="changePoints(
                            ${faction.id},
                            100
                        )"
                    >
                        +100
                    </button>


                    <button
                        class="rename"
                        onclick="renameFaction(
                            ${faction.id}
                        )"
                    >
                        RENAME
                    </button>


                    <button
                        class="delete"
                        onclick="deleteFaction(
                            ${faction.id}
                        )"
                    >
                        DELETE
                    </button>

                </div>

            `;


            list.appendChild(
                element
            );

        }
    );

}


/* =========================================
   PIE CHART
========================================= */

function updateChart() {

    const canvas =
        document.getElementById(
            "factionChart"
        );


    const labels =
        factions.map(
            faction =>
                faction.name
        );


    const values =
        factions.map(
            faction =>
                faction.points
        );


    const total =
        factions.reduce(
            (sum, faction) =>
                sum + faction.points,
            0
        );


    document.getElementById(
        "totalPoints"
    ).textContent =
        total.toLocaleString();


    if (chart) {

        chart.destroy();

    }


    if (
        factions.length === 0 ||
        total === 0
    ) {

        chart =
            new Chart(
                canvas,
                {

                    type: "pie",

                    data: {

                        labels: [
                            "NO DATA"
                        ],

                        datasets: [

                            {

                                data: [1]

                            }

                        ]

                    },

                    options: {

                        responsive: true,

                        maintainAspectRatio:
                            false,

                        plugins: {

                            legend: {
                                display: false
                            }

                        }

                    }

                }
            );

        return;

    }


    chart =
        new Chart(
            canvas,
            {

                type: "pie",

                data: {

                    labels: labels,

                    datasets: [

                        {

                            data: values

                        }

                    ]

                },


                options: {

                    responsive: true,

                    maintainAspectRatio:
                        false,

                    plugins: {

                        legend: {

                            position:
                                "bottom"

                        },


                        tooltip: {

                            callbacks: {

                                label:
                                    function(
                                        context
                                    ) {

                                        const value =
                                            context.raw;

                                        const percentage =
                                            (
                                                value /
                                                total
                                            ) *
                                            100;


                                        return (
                                            context.label
                                            +
                                            ": "
                                            +
                                            value.toLocaleString()
                                            +
                                            " points ("
                                            +
                                            percentage.toFixed(1)
                                            +
                                            "%)"
                                        );

                                    }

                            }

                        }

                    }

                }

            }
        );

}


/* =========================================
   SECURITY
========================================= */

function escapeHTML(text) {

    const div =
        document.createElement(
            "div"
        );

    div.textContent =
        text;

    return div.innerHTML;

}


/* =========================================
   ENTER KEY
========================================= */

document
    .getElementById("factionName")
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter"
            ) {

                addFaction();

            }

        }
    );


/* =========================================
   MAIN RENDER
========================================= */

function render() {

    renderFactions();

    updateChart();

}


render();

</script>

</body>
</html>
```
